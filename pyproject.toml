[project]
name = "bean-import-prototype"
version = "0.1.0"
description = "A small, local-first CSV to Beancount importer prototype"
readme = "README.md"
license = { text = "Apache-2.0" }
requires-python = ">=3.12"
dependencies = [
    "beancount>=3,<4",
    "beangulp>=0.2",
]

[project.scripts]
bean-import-csv = "bean_import.cli:main"

[project.optional-dependencies]
fava = ["fava>=1,<2"]

[dependency-groups]
dev = [
    "pyright>=1.1.400",
    "pytest>=8.3",
    "ruff>=0.11",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/bean_import"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.pyright]
pythonVersion = "3.12"
typeCheckingMode = "strict"
reportMissingTypeStubs = false
include = ["src", "tests", "examples/fava"]
