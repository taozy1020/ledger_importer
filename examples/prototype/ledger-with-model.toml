# 里程碑 2：在里程碑 1 的配置上加一张 [semantic] 表，接本地 Ollama。
currency = "CNY"
date_window_days = 2

[batch]
folder = "statements"

[[sources]]
type = "wechat"
account = "Assets:WeChat:Balance"

[[sources]]
type = "alipay"
account = "Assets:Alipay:Balance"

[[sources]]
type = "boc_debit"
account = "Assets:Bank:BOC:Debit"

[[sources]]
type = "boc_credit"
account = "Liabilities:CreditCard:BOC"

[[cards]]
number = "6217000000001234"
account = "Assets:Bank:BOC:Debit"

[[cards]]
number = "6259000000005678"
account = "Liabilities:CreditCard:BOC"

[unknown]
expense = "Expenses:Unknown"
income = "Income:Unknown"

[roles]
expense = [
  "Expenses:Food:Delivery",
  "Expenses:Food:Quick",
  "Expenses:Food:Groceries",
  "Expenses:Food:Dining",
  "Expenses:Unknown",
]
income = ["Income:Salary", "Income:Unknown"]

# 整张表删掉就退回里程碑 1。本地 Ollama 不需要 API key。
[semantic]
endpoint = "http://127.0.0.1:11434/v1"
model = "qwen3:8b"
api_key_env = "BEAN_IMPORT_LLM_API_KEY"
skill = "skills/food.md"
max_memories = 8
