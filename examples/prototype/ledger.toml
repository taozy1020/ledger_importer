# 里程碑 1：只用确定性信息导入。没有 [semantic]，不会连接任何模型。
currency = "CNY"
date_window_days = 2

# 账单下载到这个文件夹就行，平时不用改这份配置。
[batch]
folder = "statements"

# 一个平台账号一条。同一个平台有两个账号就写两条，
# identity 填账单文件头里的身份：微信昵称、支付宝账户或姓名、银行卡号。
[[sources]]
type = "wechat"
account = "Assets:WeChat:Balance"

[[sources]]
type = "alipay"
account = "Assets:Alipay:Balance"

[[sources]]
type = "boc_debit"
account = "Assets:Bank:BOC:Debit"

[[sources]]
type = "boc_credit"
account = "Liabilities:CreditCard:BOC"

# 写完整卡号；账单里只有后四位，匹配时用后四位。
[[cards]]
number = "6217000000001234"
account = "Assets:Bank:BOC:Debit"

[[cards]]
number = "6259000000005678"
account = "Liabilities:CreditCard:BOC"

# 无法由账单本身确定分类时，按金额方向落到这两个账户。
[unknown]
expense = "Expenses:Unknown"
income = "Income:Unknown"

# 决策日志：记下每次提议，之后用 bean-import-learn 把你的选择回收进来。
# 默认就是下面这样，写出来只是为了让它可见。
[journal]
enabled = true
path = "decisions.jsonl"

# 历史候选：审核时在 metadata 里给出「以前类似场合你选了什么」。
# auto_accept_above = 0 表示永远只提示、不替你填账户。
[advice]
half_life_days = 180
max_candidates = 3
correction_weight = 1.0
acceptance_weight = 0.4
auto_accept_above = 0.0
# 候选写进账本后就永久留在那里。short 只留一行候选，full 连证据句一起留，none 什么都不留。
metadata = "short"

[roles]
expense = [
  "Expenses:Food:Delivery",
  "Expenses:Food:Quick",
  "Expenses:Food:Groceries",
  "Expenses:Food:Dining",
  "Expenses:Unknown",
]
income = ["Income:Salary", "Income:Unknown"]
